<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Lost & Found Board</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <span class="brand-pin"></span>
      <div>
        <h1>Lost &amp; Found</h1>
        <span>Campus Board · report it, find it, return it</span>
      </div>
    </div>
    <nav class="main-nav">
      <a class="nav-link" href="index.html">The Board</a>
      <a class="nav-link primary" href="report.html">+ Report Item</a>
      <a class="nav-link" href="my-items.html" id="nav-my-items" style="display:none">My Reports</a>
      <span id="nav-auth-area"></span>
    </nav>
  </div>
</header>

<main class="container">
  <section class="stats-bar" id="stats-bar"></section>

  <section class="catalog-bar">
    <div class="catalog-grid">
      <div class="field">
        <label for="search-input">Search</label>
        <input id="search-input" type="text" placeholder="Blue backpack, student ID, keys…" />
      </div>
      <div class="field">
        <label for="status-select">Status</label>
        <select id="status-select">
          <option value="all">Lost + Found</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
      </div>
      <div class="field">
        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="field">
        <label for="sort-select">Sort</label>
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
    </div>
  </section>

  <p class="result-meta" id="result-meta"></p>

  <section class="board-grid" id="board-grid"></section>

  <nav class="pagination" id="pagination"></nav>
</main>


<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/nav.js"></script>
<script src="js/board.js"></script>
</body>
</html>
